[project]
name = "nano-claude"
version = "0.1.0"
description = "A minimal viable implementation of Claude Code in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "aiofiles>=23.0",
    "python-frontmatter>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
nano-claude = "nano_claude.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
