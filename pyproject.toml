[project]
name = "nano-claude"
version = "0.1.0"
description = "A minimal viable implementation of Claude Code in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: all ADK usage is confined to nano_claude/adk/, and the
    # extension-point APIs we build on (callbacks, BaseTool, BaseSessionService)
    # have churned across minor versions. Bump deliberately, with the live
    # integration test as the gate.
    "google-adk==2.2.0",
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "aiofiles>=23.0",
    "python-frontmatter>=1.0",
    "mcp>=1.0",
    "opentelemetry-api>=1.20.0",
]

[project.optional-dependencies]
# The OpenTelemetry SDK + OTLP exporter are only needed to *emit* telemetry; the
# instrumentation in the loop relies on the always-installed API and no-ops
# without these. See nano_claude/telemetry.py.
otel = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]
# The offline SWE-bench evaluation pipeline (evals/) needs the HuggingFace
# `datasets` loader and the official `swebench` harness (Docker-based grading).
# Kept optional so the agent runtime stays lean: `pip install -e ".[evals]"`.
evals = [
    "datasets>=2.19",
    "swebench>=3.0",
]
dev = [
    "nano-claude[otel]",
    "nano-claude[evals]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
nano-claude = "nano_claude.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
